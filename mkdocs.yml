site_name: Chinese LLM Wiki
site_description: Open Source AI Knowledge Hub
site_url: https://tempzhang.github.io/chinese-llm-wiki/
repo_url: https://github.com/tempzhang/chinese-llm-wiki
repo_name: tempzhang/chinese-llm-wiki
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换浅色模式

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tempzhang/chinese-llm-wiki

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js

plugins:
  - search
  - awesome-pages
  - git-revision-date-localized:
      type: datetime
      timezone: Asia/Shanghai
      locale: zh
      fallback_to_build_date: true
  - minify:
      minify_html: true
  - redirects

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Getting Started:
      - START HERE: Knowledge-Hub/START-HERE.md
      - Quick Links: Knowledge-Hub/Quick-Links.md
      - Use Cases: Knowledge-Hub/Use-Cases.md
  - Knowledge:
      - Core Topics: TOPICS.md
      - Models: INDEX.md
      - Agent: MOCs/Agent-MOC.md
      - MCP: MOCs/MCP-MOC.md
      - RAG: MOCs/RAG-MOC.md
  - Learning Paths:
      - AI Beginner Path: Learning-Paths/AI-Beginner-Path.md
      - LLM Engineer Path: Learning-Paths/LLM-Engineer-Path.md
      - RAG Engineer Path: Learning-Paths/RAG-Engineer-Path.md
      - Agent Engineer Path: Learning-Paths/Agent-Engineer-Path.md
      - AI Coding Path: Learning-Paths/AI-Coding-Path.md
  - Playbooks:
      - Build RAG System: Playbooks/Build-RAG-System.md
      - Build AI Agent: Playbooks/Build-AI-Agent.md
      - Build MCP Server: Playbooks/Build-MCP-Server.md
      - Build AI Coding Workflow: Playbooks/Build-AI-Coding-Workflow.md
      - Build Automation System: Playbooks/Build-Automation-System.md
  - Knowledge Graph: KNOWLEDGE_GRAPH.md
  - Roadmap: ROADMAP.md

copyright: Copyright © Chinese LLM Wiki Contributors
